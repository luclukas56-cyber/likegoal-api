name: Refresh portfolio statistics
on:
  workflow_dispatch:
  push:
    branches: [main, portfolio-stats-updater]
    paths:
      - '.github/workflows/portfolio-stats.yml'
      - 'portfolio-stats/**'
permissions:
  contents: read
  id-token: write
concurrency:
  group: portfolio-stats-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Roblox and Discord counts
        run: node portfolio-stats/scripts/refresh.mjs
      - name: Publish signed snapshots to the portfolio backend
        run: node portfolio-stats/scripts/publish.mjs
